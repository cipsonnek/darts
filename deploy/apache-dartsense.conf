# DartSense operator panel — reverse proxy to the app on 127.0.0.1:__PORT__.
# certbot adds the HTTPS (443) virtual host and the redirect.
<VirtualHost *:80>
    ServerName __DOMAIN__

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:__PORT__/
    ProxyPassReverse / http://127.0.0.1:__PORT__/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set Referrer-Policy same-origin
</VirtualHost>
